# Render Blueprint: one web service (API + MCP + built React app) + managed PostgreSQL.
# NOTE: not validated against Render from the build sandbox; if the Blueprint is rejected, follow the manual steps in README.
services:
  - type: web
    name: placementos
    runtime: node
    plan: starter            # always-on; free plans sleep and would make the MCP connector time out
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: placementos-db, property: connectionString }
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: MCP_SECRET        # set to: openssl rand -hex 24   (URL-safe)
        sync: false
databases:
  - name: placementos-db
    plan: basic-256mb
    databaseName: placementos
